# レスポンスに付けるセキュリティヘッダ（CSP はホストごとに違うので、各 server ブロックで書く）。
# 注意: add_header は「その階層で add_header を1つも書いていない場合だけ」親から引き継がれる。
# location の中で add_header を書くと、ここのヘッダは全部消える。だから location では書かない。
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# HSTS: 学習用に短く（5分）。本番では長くする。localhost で長くすると他の開発で困る
add_header Strict-Transport-Security "max-age=300" always;
