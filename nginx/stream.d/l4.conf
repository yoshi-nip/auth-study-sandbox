# L4（TCP）プロキシ（Phase 5）。AWS でいう NLB の立場。
# バイト列をそのまま流すだけで、HTTP の中身（Host・パス・Cookie・ヘッダ）は一切見ない。だから:
#   - パスで振り分けられない（/ も /api/ も全部 BFF に行く。静的ファイルは返らない）
#   - nginx の auth_request も security ヘッダも X-Forwarded-For も効かない
#   - BFF から見た接続元は nginx（本当のクライアントは分からない。必要なら PROXY protocol を使う）
# L7 の関門を素通りしても、BFF・API の層で止まる（多層防御）ことを確かめるために置いている。
# ホストの 127.0.0.1 にだけ公開する（compose.yaml）。
resolver 127.0.0.11 valid=5s ipv6=off;

log_format l4 escape=json
    '{"time":"$time_iso8601","layer":"L4","client":"$remote_addr","upstream":"$upstream_addr",'
    '"status":$status,"bytes_in":$bytes_received,"bytes_out":$bytes_sent,"session_time":$session_time}';
access_log /dev/stdout l4;

upstream bff_l4 {
    zone bff_l4 64k;
    server bff:8080 resolve;
}

server {
    listen 9000;
    proxy_pass bff_l4;
    proxy_connect_timeout 3s;
}
