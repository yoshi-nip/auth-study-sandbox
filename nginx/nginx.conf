# nginx のメイン設定。http（L7）と stream（L4）の2つの世界がある。
#   http   : HTTP を理解する。Host・パス・ヘッダで振り分け、認証の前段チェックやヘッダ付与ができる（≒ AWS ALB）
#   stream : TCP/UDP をそのまま流す。中身は見ない（≒ AWS NLB）。Phase 5 で使う
user  nginx;
worker_processes  auto;
error_log  /dev/stderr notice;
pid        /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;            # エラーページ等に nginx のバージョンを出さない
    sendfile      on;
    keepalive_timeout 65;

    # Docker の内部 DNS。upstream の `resolve` と変数入りの proxy_pass が、起動後も名前を引き直す
    resolver 127.0.0.11 valid=5s ipv6=off;

    # 誰が・どこへ・どの upstream に流したかを JSON で残す。request_id は BFF・API のログにも伝わる
    log_format main_json escape=json
        '{"time":"$time_iso8601","layer":"L7","host":"$host","method":"$request_method",'
        '"uri":"$request_uri","status":$status,"upstream":"$upstream_addr",'
        '"request_id":"$request_id","rt":$request_time}';
    access_log /dev/stdout main_json;

    # TLS 終端。ここで復号し、内部ネットワークは HTTP で流す（AWS ALB の HTTPS リスナーと同じ考え方）
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    include /etc/nginx/conf.d/*.conf;
}

stream {
    include /etc/nginx/stream.d/*.conf;
}
