<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン — auth-sandbox IdP</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <main class="card">
    <h1>auth-sandbox IdP</h1>
    <p class="note">ここは認証基盤（auth.localhost）の画面です。パスワードはアプリ（app.localhost）にも BFF にも渡りません。</p>
    {{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
    <form method="post" action="{{.Action}}">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <label>ユーザー名 <input name="username" autocomplete="username" required autofocus></label>
      <label>パスワード <input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">ログイン</button>
    </form>
    <p class="hint">デモユーザー: <code>alice</code>（editor）／<code>bob</code>（viewer）。パスワードは <code>.env</code> の <code>DEMO_PASSWORD</code>。</p>
  </main>
</body>
</html>
